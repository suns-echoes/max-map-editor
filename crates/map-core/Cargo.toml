[package]
name    = "map-core"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

[dependencies]
json       = { workspace = true }
max-assets = { workspace = true }

# Examples only - the library itself stays on json + max-assets. `png` is the
# same exact-pinned workspace crate `app` already links, so this adds no new
# supply-chain surface, just an encoder for the offline template export.
[dev-dependencies]
png = { workspace = true }

[features]
# Opt-in shore-solver instrumentation: SHORE_TIME=1 stderr timing and the
# SHORE_REPAIR_BUDGET override. Off by default so the library stays headless
# (no env reads / stderr writes). Build with `--features map-core/shore-instrument`.
shore-instrument = []

[lints]
workspace = true
