name: Audit

# Dependency advisories (RustSec) against Cargo.lock. Runs when the lockfile
# (or this policy) changes, plus weekly - new advisories are published against
# crates we already lock, so waiting for the next lockfile change isn't enough.
on:
  push:
    branches: [rust, main, dev]
    paths:
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

# Least privilege: only ever reads the checkout.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built from source (no third-party install action); --locked keeps the
      # tool's own dep tree reproducible. ~2-3 min on a cold runner.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Warnings (unmaintained/unsound) fail too; accepted ones are listed
      # with justifications in .cargo/audit.toml.
      - name: Audit dependencies
        run: cargo audit --deny warnings
