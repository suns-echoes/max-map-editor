name: CI

on:
  push:
    branches: [rust, main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # The script regression suite (app/tests/scripts.rs) needs a GPU, which the
  # runners don't have - it self-skips when CI is set. Everything else runs.
  CI: "true"

# Least privilege: every job here only ever reads the checkout.
permissions:
  contents: read

jobs:
  # The cheap lane: map-core and the support crates, plus the tree-wide checks
  # (formatting, license policy). No graphics stack needed, so it stays fast
  # and green on every branch.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add rustfmt + clippy
        run: rustup component add rustfmt clippy

      # Formatting is the source of truth (rustfmt.toml) - fail on drift.
      # Source-only, so this covers the app crate too.
      - name: Format check
        run: cargo fmt --check

      # Dependency license policy (permissive only) + attribution freshness
      # (reads Cargo.lock directly - no cargo invocation, no build).
      - name: License check
        run: node tools/licenses.mjs --check

      # crates/wgpu-ui is a mirror of the sibling toolkit repo. The runner has
      # no sibling checkout, so this skips cleanly here; it is the local
      # pre-commit guard that a hand-edit under crates/wgpu-ui never sticks.
      - name: wgpu-ui mirror check
        run: node tools/vendor-wgpu-ui.mjs --check

      # Deny warnings on the gated core crates (`max-assets` still tracks its
      # re-MAX upstream and stays ungated; the app crate is in the app lane).
      - name: Clippy (core crates)
        run: cargo clippy -p map-core -p ini --all-targets --no-deps -- -D warnings

      # map-core's equivalence proof self-skips loudly without the
      # (copyrighted, gitignored) testdata/originals fixtures; every other
      # map-core/assets/ini/json test runs here.
      - name: Test (core crates)
        run: cargo test -p map-core -p max-assets -p ini -p json

  # The full-workspace lane. `wgpu-ui` has no public remote, so this used to be
  # unbuildable on a runner and sat gated to the pre-wgpu-ui branches; the
  # toolkit is committed at crates/wgpu-ui now, so a plain checkout builds.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # winit + wgpu need these to *build* on Linux (X11/Wayland dev libs).
      # mesa-vulkan-drivers provides lavapipe (software Vulkan) so the runner
      # has an adapter at all - `gpu.rs::pick_adapter` asks for a hardware one
      # and falls back to a software rasterizer. This is what wgpu-ui's own CI
      # does. Tests that still find no adapter skip cleanly rather than fail.
      #
      # This comment used to add "so they are deterministic under it" about the
      # goldens. That is false and cost five red releases: the render is
      # deterministic for a *given* rasterizer build, not across builds. See the
      # Test step below.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev \
            mesa-vulkan-drivers vulkan-tools

      # Which adapter the goldens actually rendered on, and at what mesa
      # version - the first thing to know when a snapshot diff shows up below.
      - name: Report the Vulkan adapter
        continue-on-error: true
        run: vulkaninfo --summary

      - name: Add clippy
        run: rustup component add clippy

      # The toolkit is held to its own stricter lints (see the generated
      # crates/wgpu-ui/Cargo.toml), not the app's house-style allow-list.
      - name: Clippy (app + toolkit)
        run: cargo clippy -p max-map-editor -p wgpu-ui --all-targets --no-deps -- -D warnings

      # The runners have no GPU: every test that needs an adapter self-skips
      # (wgpu-ui's own unit tests included), and the rest run.
      #
      # The visual goldens still RENDER here - that is what catches a panic or a
      # missing resource on a fresh checkout - but their comparison self-skips
      # because `CI` is set. AE=0 cannot survive a rasterizer rebuild: baselines
      # recorded on llvmpipe LLVM 19.1.7 fail on this runner's LLVM 20.1.2
      # across ~97% of every dialog frame (a modal dims the whole base, so one
      # ULP in the shader's sRGB<->linear path re-rounds every dimmed pixel) and
      # ~1% of every panel frame. That is precision, not content, and it made
      # this job red on every release from v0.6.0 to v0.8.2 before anyone
      # noticed - see BACKLOG 7.1, where the durable fix is a per-channel
      # tolerance rather than this skip.
      - name: Test (workspace)
        run: cargo test --workspace

      # Only produces anything when the comparison is forced back on with
      # MAX_REQUIRE_SNAPSHOTS=1 (a deliberate runner check). Kept so that when
      # someone does that, the `<name>.actual.png` / `<name>.diff.png` pairs can
      # be looked at rather than guessed at.
      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-diffs
          path: |
            app/tests/snapshots/*.actual.png
            app/tests/snapshots/*.diff.png
          if-no-files-found: ignore
          retention-days: 7
